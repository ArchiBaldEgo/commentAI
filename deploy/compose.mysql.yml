services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: sentiment
      MYSQL_DATABASE: sentiment
      MYSQL_USER: sentiment
      MYSQL_PASSWORD: sentiment
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  sentiment-api:
    build: .
    environment:
      DB_URL: mysql+pymysql://sentiment:sentiment@db:3306/sentiment
      STORAGE_MODE: db
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  mysqldata:
