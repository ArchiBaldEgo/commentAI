version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${PG_DB:-sentiment}
      - POSTGRES_USER=${PG_USER:-sentiment}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-sentiment}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  sentiment-api:
    environment:
      - STORAGE_MODE=db
      - DB_URL=postgresql+psycopg2://${PG_USER:-sentiment}:${PG_PASSWORD:-sentiment}@postgres:5432/${PG_DB:-sentiment}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
